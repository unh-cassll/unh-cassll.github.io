# Custom Pages deployment replacing the managed pages-build-deployment
# pipeline.  The site is plain static HTML (no Jekyll), so the artifact is
# the repository content as-is.  The deploy step is retried once after a
# pause: the managed pipeline has no retry, and its transient "Deployment
# failed, try again later" errors were failing ~15% of the every-10-minute
# live-dashboard deployments.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress: true so a stuck run cannot freeze the site.  A run that
# enters "waiting" on the github-pages environment protection rule holds the
# group indefinitely; with queueing every later push was cancelled behind it
# and the site sat on stale content for hours while the publisher kept
# reporting success (2026-08-25 22:30Z and 2026-08-27 23:40Z).  Superseding is
# safe here: the dashboard republishes every 10 minutes, so the newest content
# is the only one that matters, and a cancelled deploy is retried by the next
# push rather than lost.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Stage site content
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude='.git' --exclude='.github' . /tmp/site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Pause before retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - name: Retry deploy
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
